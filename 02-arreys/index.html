<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Масиви в JS | Підготовка до React</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>JS Market</h1>    
  </header>

  <main class="app-container">
    <section class="products-section">
      <h2>Доступні курси</h2>
      <ul id="products-list" class="list">
        </ul>
    </section>

    <section class="cart-section">
      <h2>Ваш кошик</h2>
      <ul id="cart-list" class="list">
        </ul>
      
      <div class="cart-summary">
        <strong>Загальна сума:</strong> 
        <span id="cart-total" class="total-price">$0</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
